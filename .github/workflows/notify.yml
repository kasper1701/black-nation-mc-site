name: Discord Commit Notify
 
on:
  push:
    branches:
      - main
 
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG="${{ github.event.commits[0].message }}"
          AUTHOR="${{ github.event.commits[0].author.name }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_COUNT="${{ github.event.commits.length }}"
          COMPARE_URL="${{ github.event.compare }}"
 
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"color\": 3066993,
                \"author\": {
                  \"name\": \"${AUTHOR}\"
                },
                \"description\": \"**[${REPO}:${BRANCH}] ${COMMIT_COUNT} new commit**\n\n\`${SHORT_SHA}\` ${COMMIT_MSG} - ${AUTHOR}\",
                \"url\": \"${COMPARE_URL}\"
              }]
            }" \
            "$DISCORD_WEBHOOK"
