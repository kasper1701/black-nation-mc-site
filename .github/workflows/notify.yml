name: notify

on:
  push:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Embed
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "New Commit",
              "description": "${{ github.event.head_commit.message }}",
              "color": 3447003
            }]
          }' \
          "${{ secrets.DISCORD_WEBHOOK }}"
